<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Protein 2 – interaktiv membranmodel</title><style>
:root{font-family:system-ui,Arial,sans-serif;color:#172b40;background:#f3f7fb}*{box-sizing:border-box}main{max-width:1050px;margin:22px auto;padding:0 16px}h1{font-size:1.55rem;margin-bottom:5px}.sub{color:#506377;margin:0 0 18px}.panel{background:white;border:1px solid #d9e4ef;border-radius:16px;padding:18px;box-shadow:0 4px 18px #1d385015}.controls{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin:12px 0 16px}.slider{flex:1;min-width:220px}input[type=range]{width:100%;accent-color:#1764b4}button{border:1px solid #9bb6d2;background:#eef6ff;color:#153f6a;border-radius:9px;padding:9px 12px;font-size:.94rem;cursor:pointer}button:hover{background:#dbeeff}button:focus-visible,input:focus-visible{outline:3px solid #f4a340;outline-offset:2px}.status{font-weight:700;padding:6px 12px;border-radius:8px;background:#e7eef6}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.group{border:1px solid #dce5ed;border-radius:12px;padding:12px}.group strong{display:block;margin-bottom:8px}.buttons{display:flex;gap:7px;flex-wrap:wrap}.readout{font-size:.94rem;color:#44586b;margin-top:10px}.visual{position:relative;width:100%;border:1px solid #cbdce8;border-radius:13px;overflow:hidden;background:#eaf7ff}.refractory{position:absolute;right:16px;top:13px;background:#fff0d9;color:#8b3f0d;border:2px solid #d68c45;padding:8px 12px;border-radius:9px;font-weight:800;font-size:1rem;z-index:2}.refractory[hidden]{display:none}svg{display:block;width:100%;height:auto}.legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;font-size:.9rem}.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px;vertical-align:middle}.note{color:#4b6074;font-size:.88rem;line-height:1.5}.head{fill:#5da6dd;stroke:#286c9d;stroke-width:1.3}.tail{stroke:#7a9aaf;stroke-width:3;stroke-linecap:round}.protein{fill:#8b6ad5;stroke:#51379c;stroke-width:3}.proteinInner{fill:#b8a5ed;stroke:#6745ac;stroke-width:2}.gate{fill:#5e3aa5;stroke:#3e247a;stroke-width:2;transition:transform .4s ease}.ionNa{fill:#ffae42;stroke:#9c5500;stroke-width:1.7}.ionK{fill:#45bf83;stroke:#167249;stroke-width:1.7}.ionText{font-size:13px;font-weight:800;fill:#172b40;text-anchor:middle;dominant-baseline:middle;pointer-events:none}.arrow{fill:none;stroke:#d46c0d;stroke-width:5;stroke-linecap:round;stroke-dasharray:8 8}.hidden{display:none}.count{font-variant-numeric:tabular-nums}#leftHalf,#rightHalf{transition:transform .55s ease}#naLayer circle,#naLayer text,#kLayer circle,#kLayer text{transition:opacity .15s} @media(max-width:620px){.row{grid-template-columns:1fr}.panel{padding:12px}h1{font-size:1.3rem}}
</style></head><body><main><h1>Protein 2</h1><section class="panel"><label for="voltage"><strong>Membranpotentiale (inde i cellen): <output id="mv">−70 mV</output></strong></label><div class="controls"><div class="slider"><input id="voltage" type="range" min="-100" max="100" step="1" value="-70" aria-label="Membranpotentiale i millivolt"><div style="display:flex;justify-content:space-between;font-size:.82rem;color:#566b7f"><span>−100 mV</span><span>0 mV</span><span>+100 mV</span></div></div><span id="state" class="status" aria-live="polite">Lukket</span><button id="reset">Nulstil</button></div><div class="visual"><div id="refractory" class="refractory" role="status" hidden>Refraktærperiode</div><svg id="scene" viewBox="0 0 900 510" role="img" aria-label="Grafisk model af en cellemembran med fosfolipid-dobbeltlag, spændingsstyret protein og bevægelige natrium- og kaliumioner"><defs><linearGradient id="out" x2="0" y2="1"><stop stop-color="#e0f5ff"/><stop offset="1" stop-color="#effaff"/></linearGradient><linearGradient id="inside" x2="0" y2="1"><stop stop-color="#fff6e8"/><stop offset="1" stop-color="#fffaf2"/></linearGradient><linearGradient id="core" x2="0" y2="1"><stop stop-color="#e3e4f5"/><stop offset="1" stop-color="#eae9f8"/></linearGradient></defs><rect width="900" height="210" fill="url(#out)"/><rect y="210" width="900" height="100" fill="url(#core)"/><rect y="310" width="900" height="200" fill="url(#inside)"/><text x="24" y="34" font-size="21" font-weight="700" fill="#245678">Uden for cellen</text><text x="24" y="483" font-size="21" font-weight="700" fill="#865a2a">Inde i cellen</text><g id="lipids"></g><g id="protein"><g id="leftHalf"><path class="protein" d="M446 177 Q381 175 382 214 L382 307 Q381 345 446 343 L446 177 Z"/><path class="proteinInner" d="M436 185 L446 185 L446 335 L436 335 Q422 310 424 260 Q422 208 436 185 Z"/></g><g id="rightHalf"><path class="protein" d="M454 177 Q519 175 518 214 L518 307 Q519 345 454 343 L454 177 Z"/><path class="proteinInner" d="M464 185 L454 185 L454 335 L464 335 Q478 310 476 260 Q478 208 464 185 Z"/></g><text x="450" y="164" font-size="17" text-anchor="middle" font-weight="700" fill="#503591">Protein 2</text></g><g id="naTransit"></g><g id="naLayer"></g><g id="kLayer"></g></svg></div><div class="legend"><span><i class="dot" style="background:#ffae42"></i>Na⁺</span><span><i class="dot" style="background:#45bf83"></i>K⁺</span><span><i class="dot" style="background:#5da6dd"></i>Fosfolipidernes hydrofile hoveder</span><span><i class="dot" style="background:#8b6ad5"></i>Membranprotein</span></div><div class="row" style="margin-top:15px"><div class="group"><strong>Uden for cellen</strong><div class="buttons"><button id="naOut">+5 Na⁺</button><button id="kOut">+5 K⁺</button></div><div class="readout count">Na⁺: <span id="naOutN">0</span> · K⁺: <span id="kOutN">0</span></div></div><div class="group"><strong>Inde i cellen</strong><div class="buttons"><button id="naIn">+5 Na⁺</button><button id="kIn">+5 K⁺</button></div><div class="readout count">Na⁺: <span id="naInN">0</span> · K⁺: <span id="kInN">0</span></div></div></div></section></main><script>
(()=>{'use strict';const NS='http://www.w3.org/2000/svg',by=id=>document.getElementById(id);const counts={naOut:0,naIn:0,kOut:0,kIn:0};const particles=[];let serial=0,last=0,refractoryUntil=0,previousVoltage=-70;const voltage=by('voltage');const lipids=by('lipids');function svg(tag,attrs,parent){const el=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))el.setAttribute(k,v);parent.appendChild(el);return el}for(let x=13;x<900;x+=22){if(x>374&&x<526)continue;for(const y of [218,302]){svg('line',{x1:x-3,y1:y===218?229:290,x2:x-5,y2:y===218?254:267,class:'tail'},lipids);svg('line',{x1:x+3,y1:y===218?229:290,x2:x+5,y2:y===218?254:267,class:'tail'},lipids);svg('circle',{cx:x,cy:y,r:8,class:'head'},lipids)}}function channel(){const v=+voltage.value;if(performance.now()<refractoryUntil)return 'refractory';return v>=-55&&v<30?'open':v>=30?'inactive':'closed'}function update(){const v=+voltage.value,s=channel();by('mv').textContent=(v<0?'−':v>0?'+':'')+Math.abs(v)+' mV';by('state').textContent=s==='open'?'Åben':s==='refractory'?'Refraktær':'Lukket';by('refractory').hidden=s!=='refractory';by('state').style.background=s==='open'?'#d9f7e6':'#e7eef6';by('leftHalf').setAttribute('transform',s==='open'?'translate(-30 0)':'translate(0 0)');by('rightHalf').setAttribute('transform',s==='open'?'translate(30 0)':'translate(0 0)');for(const k of Object.keys(counts))by(k+'N').textContent=counts[k]}
function add(type,side){const key=type+side;for(let i=0;i<5;i++){const p={id:serial++,type,side,x:0,y:0,target:false};place(p);particles.push(p);counts[key]++}update()}function place(p){const outer=p.side==='Out';let x=80+Math.random()*740;if(x>350&&x<550)x+=x<450?-120:120;p.x=Math.max(32,Math.min(865,x));p.y=outer?55+Math.random()*115:350+Math.random()*100;p.vx=(Math.random()-.5)*.19;p.vy=(Math.random()-.5)*.19}function render(){for(const group of ['naLayer','kLayer'])by(group).replaceChildren();for(const p of particles){const parent=by(p.type==='na'?'naLayer':'kLayer');svg('circle',{cx:p.x,cy:p.y,r:13,class:p.type==='na'?'ionNa':'ionK'},parent);const t=svg('text',{x:p.x,y:p.y+1,class:'ionText'},parent);t.textContent=p.type==='na'?'Na⁺':'K⁺'}}let moving=null;let lastStart=0;function tick(t){const dt=Math.min(50,t-last||16);last=t;const open=channel()==='open';if(!moving&&open&&counts.naOut>0&&t-lastStart>1150){const p=particles.find(p=>p.type==='na'&&p.side==='Out'&&!p.transit);if(p){p.transit=true;p.progress=0;p.startX=p.x;p.startY=p.y;moving=p;lastStart=t}}for(const p of particles){if(p.transit){if(open){p.progress=Math.min(1,p.progress+dt/1350);const q=p.progress; // Approach above the membrane, then move vertically inside the pore.
if(q<.32){const f=q/.32;p.x=p.startX+(450-p.startX)*f;p.y=p.startY+(177-p.startY)*f}else if(q<.73){p.x=450;p.y=177+(343-177)*(q-.32)/.41}else{const f=(q-.73)/.27;p.x=450;p.y=343+55*f}
if(q>=1){p.transit=false;p.side='In';moving=null;counts.naOut--;counts.naIn++;setVoltage(Math.min(100,+voltage.value+5));place(p);update()}}}else{// Random thermal-like motion, constrained to each aqueous compartment.
const scale=dt/16;p.vx+=(Math.random()-.5)*.035*scale;p.vy+=(Math.random()-.5)*.035*scale;
const speed=Math.hypot(p.vx,p.vy),maxSpeed=.85;if(speed>maxSpeed){p.vx*=maxSpeed/speed;p.vy*=maxSpeed/speed}
p.x+=p.vx*scale;p.y+=p.vy*scale;
const ymin=p.side==='Out'?52:348,ymax=p.side==='Out'?185:458;
if(p.x<28){p.x=28;p.vx=Math.abs(p.vx)}if(p.x>872){p.x=872;p.vx=-Math.abs(p.vx)}
if(p.y<ymin){p.y=ymin;p.vy=Math.abs(p.vy)}if(p.y>ymax){p.y=ymax;p.vy=-Math.abs(p.vy)}}}if((refractoryUntil>0&&t>=refractoryUntil)){refractoryUntil=0;update()}render();requestAnimationFrame(tick)}function setVoltage(value){const next=+value;if(previousVoltage<30&&next>=30)refractoryUntil=performance.now()+5000;previousVoltage=next;voltage.value=next;update()}voltage.addEventListener('input',()=>setVoltage(voltage.value));for(const type of ['na','k'])for(const side of ['Out','In'])by(type+side).addEventListener('click',()=>add(type,side));by('reset').addEventListener('click',()=>{particles.length=0;moving=null;lastStart=0;for(const k in counts)counts[k]=0;refractoryUntil=0;previousVoltage=-70;voltage.value=-70;update()});update();requestAnimationFrame(tick)})();
</script></body></html>
