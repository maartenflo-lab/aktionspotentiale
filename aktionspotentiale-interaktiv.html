<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aktionspotentiale – interaktiv</title><style>body{font:16px system-ui,Arial;background:#f3f7fb;color:#17324a;margin:0;padding:22px}.app{max-width:1050px;margin:auto;background:white;border:1px solid #c9dce9;border-radius:15px;padding:22px}h1{margin:0 0 12px;font-size:1.55rem}.graph{position:relative}svg{display:block;width:100%;height:auto;background:#fff;border:1px solid #d8e5ed;border-radius:10px}.controls{display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin:20px 0}input[type=range]{width:min(380px,80vw)}button{border:1px solid #8ba8bc;background:#eef6fc;border-radius:8px;padding:9px 13px;cursor:pointer;font:inherit}button:disabled{opacity:.5}.tiles{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.tile{background:#dfeefb;border:2px solid #5595c8;border-radius:8px;padding:10px 18px;cursor:grab;touch-action:manipulation}.tile.selected{background:#b4dbf8}.question{position:absolute;left:18%;top:14%;width:64%;background:#fffef2;border:2px solid #d4a64e;box-shadow:0 5px 20px #4564;border-radius:12px;padding:15px;box-sizing:border-box;text-align:center}.hidden{display:none}.choices{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}.drop{border:2px dashed #7b9cb1;padding:12px;border-radius:8px;min-height:22px;margin:10px auto;max-width:260px}#feedback{font-weight:700;min-height:24px}.hint{font-size:.9rem;color:#48677e}text{font-family:system-ui,Arial} @media(max-width:650px){.question{left:4%;width:92%;top:10%;padding:9px}.app{padding:12px}}</style></head><body><main class="app"><h1>Aktionspotentiale</h1><div class="graph"><svg id="plot" viewBox="0 0 940 510" role="img" aria-label="Graf over membranpotentiale fra minus 100 til plus 100 millivolt og tid fra nul til fire millisekunder"><g id="axes"></g><path id="trace" fill="none" stroke="#dc2529" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><circle id="dot" r="7" fill="#a31519" visibility="hidden"/></svg><div class="question hidden" id="question" aria-live="polite"><strong id="qtitle">Hvilket protein er aktivt i denne fase?</strong><div class="drop" id="drop" tabindex="0">Træk et protein hertil, eller vælg det under grafen</div></div></div><div class="controls"><div><label for="trigger"><strong>Membranpotentiale: <output id="voltage">−70 mV</output></strong></label><div><input id="trigger" type="range" min="-100" max="100" value="-70" step="1"></div><div>Membranpotentiale i triggerområde af nervecelle</div></div><button id="reset">Nulstil</button></div><div class="tiles" id="tiles"><button class="tile" draggable="true" data-p="1">Protein 1</button><button class="tile" draggable="true" data-p="2">Protein 2</button><button class="tile" draggable="true" data-p="3">Protein 3</button></div><div id="feedback" aria-live="polite"></div></main><script>
(()=>{'use strict';const NS='http://www.w3.org/2000/svg',axes=document.getElementById('axes'),trace=document.getElementById('trace'),dot=document.getElementById('dot'),slider=document.getElementById('trigger'),voltage=document.getElementById('voltage'),question=document.getElementById('question'),qtitle=document.getElementById('qtitle'),drop=document.getElementById('drop'),feedback=document.getElementById('feedback'),tiles=[...document.querySelectorAll('.tile')];const L=96,R=398,T=28,B=442,x=t=>L+t/4*(R-L),y=v=>B-(v+100)/200*(B-T);function el(tag,attrs,text){const n=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))n.setAttribute(k,v);if(text!==undefined)n.textContent=text;axes.append(n);return n}for(let v=-100;v<=100;v+=25){el('line',{x1:L,y1:y(v),x2:R,y2:y(v),stroke:v===-70?'#9eabb8':'#e8eef3','stroke-dasharray':v===-70?'7 6':'3 5'});el('text',{x:L-12,y:y(v)+5,'text-anchor':'end','font-size':15,fill:'#344c61'},String(v).replace('-', '−'))}for(let t=0;t<=4;t+=1){el('line',{x1:x(t),y1:B,x2:x(t),y2:B+7,stroke:'#243c50','stroke-width':1.5});el('text',{x:x(t),y:B+27,'text-anchor':'middle','font-size':14,fill:'#344c61'},String(t))}el('line',{x1:L,y1:T,x2:L,y2:B,stroke:'#243c50','stroke-width':3});el('line',{x1:L,y1:B,x2:R,y2:B,stroke:'#243c50','stroke-width':3});el('text',{x:(L+R)/2,y:495,'text-anchor':'middle','font-size':19,'font-weight':600},'Tid (ms)');el('text',{x:27,y:240,transform:'rotate(-90 27 240)','text-anchor':'middle','font-size':19,'font-weight':600},'Membranpotentiale (mV)');
// Smooth phase profiles: time in ms, voltage in mV. Each phase plays for 3 wall-clock seconds.
const smooth=u=>u*u*(3-2*u);const phases=[{a:.65,b:1.65,from:-55,to:35},{a:1.65,b:2.85,from:35,to:-85},{a:2.85,b:3.75,from:-85,to:-70}];function curve(t){if(t<.4)return -70;if(t<.65)return -70+15*smooth((t-.4)/.25);for(const p of phases)if(t<=p.b)return p.from+(p.to-p.from)*smooth(Math.max(0,Math.min(1,(t-p.a)/(p.b-p.a))));return -70}function render(t){let d='';const count=Math.max(1,Math.round(t/4*650));for(let i=0;i<=count;i++){const tt=t*i/count;d+=(i?'L':'M')+x(tt).toFixed(2)+' '+y(curve(tt)).toFixed(2)+' '}trace.setAttribute('d',d);dot.setAttribute('cx',x(t));dot.setAttribute('cy',y(curve(t)));dot.setAttribute('visibility',t>0?'visible':'hidden')};let phase=0,answers=[],running=false,frame=0,selected=null,token=0;function setValue(v){slider.value=String(v);voltage.textContent=String(Math.round(v)).replace('-', '−')+' mV'}function showQuestion(){running=false;question.classList.remove('hidden');qtitle.textContent='Hvilket protein er aktivt i fase '+(phase+1)+'?';drop.textContent='Træk et protein hertil, eller vælg det under grafen';}function animate(){const id=++token;running=true;question.classList.add('hidden');slider.disabled=true;const p=phases[phase],start=performance.now();function tick(now){if(id!==token)return;const u=Math.min(1,(now-start)/1500);const t=p.a+(p.b-p.a)*u;render(t);if(u<1){frame=requestAnimationFrame(tick)}else showQuestion()}frame=requestAnimationFrame(tick)}function answer(n){if(running||question.classList.contains('hidden'))return;answers.push(n);question.classList.add('hidden');phase++;if(phase<3){animate()}else{slider.disabled=false;if(answers.join(',')==='2,1,3'){feedback.textContent='Godt tænkt!';render(4)}else{reset();feedback.textContent='Prøv igen'}}}function reset(){token++;cancelAnimationFrame(frame);phase=0;answers=[];running=false;selected=null;slider.disabled=false;question.classList.add('hidden');feedback.textContent='';setValue(-70);render(0)}slider.addEventListener('input',()=>{if(running)return;setValue(+slider.value);if(+slider.value>=-55&&phase===0&&answers.length===0){feedback.textContent='';render(phases[0].a);animate()}});document.getElementById('reset').onclick=reset;tiles.forEach(b=>{b.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',b.dataset.p)});b.addEventListener('click',()=>{selected=+b.dataset.p;tiles.forEach(t=>t.classList.toggle('selected',t===b));if(!question.classList.contains('hidden'))answer(selected)})});drop.addEventListener('dragover',e=>e.preventDefault());drop.addEventListener('drop',e=>{e.preventDefault();const n=+e.dataTransfer.getData('text/plain');if(n>=1&&n<=3)answer(n)});drop.addEventListener('click',()=>{if(selected)answer(selected)});drop.addEventListener('keydown',e=>{if(e.key==='Enter'&&selected)answer(selected)});reset()})();
</script></body></html>
