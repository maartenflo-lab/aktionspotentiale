<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Protein 3 – interaktiv membranmodel</title><style>
:root{font-family:system-ui,Arial,sans-serif;color:#172b40;background:#f3f7fb}*{box-sizing:border-box}main{max-width:1050px;margin:22px auto;padding:0 16px}h1{font-size:1.55rem;margin-bottom:5px}.sub{color:#506377;margin:0 0 18px}.panel{background:white;border:1px solid #d9e4ef;border-radius:16px;padding:18px;box-shadow:0 4px 18px #1d385015}.controls{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin:12px 0 16px}.slider{flex:1;min-width:220px}input[type=range]{width:100%;accent-color:#1764b4}button{border:1px solid #9bb6d2;background:#eef6ff;color:#153f6a;border-radius:9px;padding:9px 12px;font-size:.94rem;cursor:pointer}button:hover{background:#dbeeff}button:focus-visible,input:focus-visible{outline:3px solid #f4a340;outline-offset:2px}.status{font-weight:700;padding:6px 12px;border-radius:8px;background:#e7eef6}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.group{border:1px solid #dce5ed;border-radius:12px;padding:12px}.group strong{display:block;margin-bottom:8px}.buttons{display:flex;gap:7px;flex-wrap:wrap}.readout{font-size:.94rem;color:#44586b;margin-top:10px}.visual{position:relative;width:100%;border:1px solid #cbdce8;border-radius:13px;overflow:hidden;background:#eaf7ff}.refractory{position:absolute;right:16px;top:13px;background:#fff0d9;color:#8b3f0d;border:2px solid #d68c45;padding:8px 12px;border-radius:9px;font-weight:800;font-size:1rem;z-index:2}.refractory[hidden]{display:none}svg{display:block;width:100%;height:auto}.legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;font-size:.9rem}.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px;vertical-align:middle}.note{color:#4b6074;font-size:.88rem;line-height:1.5}.head{fill:#5da6dd;stroke:#286c9d;stroke-width:1.3}.tail{stroke:#7a9aaf;stroke-width:3;stroke-linecap:round}.protein{fill:#d94b47;stroke:#8f2427;stroke-width:3}.proteinInner{fill:#f7a6a3;stroke:#b13e3b;stroke-width:2}.gate{fill:#5e3aa5;stroke:#3e247a;stroke-width:2;transition:transform .4s ease}.atpBody{fill:#37ad69;stroke:#16683d;stroke-width:2}.phosphate{fill:#f5d44b;stroke:#9b7914;stroke-width:1.7}.phosphateText{fill:#463600;font-size:13px;font-weight:800;text-anchor:middle;dominant-baseline:middle}.ionNa{fill:#ffae42;stroke:#9c5500;stroke-width:1.7}.ionK{fill:#45bf83;stroke:#167249;stroke-width:1.7}.ionText{font-size:13px;font-weight:800;fill:#172b40;text-anchor:middle;dominant-baseline:middle;pointer-events:none}.arrow{fill:none;stroke:#d46c0d;stroke-width:5;stroke-linecap:round;stroke-dasharray:8 8}.hidden{display:none}.count{font-variant-numeric:tabular-nums}#leftHalf,#rightHalf{transition:transform .55s ease}#naLayer circle,#naLayer text,#kLayer circle,#kLayer text{transition:opacity .15s} @media(max-width:620px){.row{grid-template-columns:1fr}.panel{padding:12px}h1{font-size:1.3rem}}
</style></head><body><main><h1>Protein 3</h1><section class="panel"><label for="voltage"><strong>Membranpotentiale (inde i cellen): <output id="mv">−85 mV</output></strong></label><div class="controls"><div class="slider"><input id="voltage" type="range" min="-100" max="100" step="1" value="-85" aria-label="Membranpotentiale i millivolt"><div style="display:flex;justify-content:space-between;font-size:.82rem;color:#566b7f"><span>−100 mV</span><span>0 mV</span><span>+100 mV</span></div></div><span id="state" class="status" aria-live="polite">Lukket</span><button id="reset">Nulstil</button></div><div class="visual"><svg id="scene" viewBox="0 0 900 510" role="img" aria-label="Grafisk model af en cellemembran med fosfolipid-dobbeltlag, membranprotein og bevægelige kalium- og natriumioner"><defs><linearGradient id="out" x2="0" y2="1"><stop stop-color="#e0f5ff"/><stop offset="1" stop-color="#effaff"/></linearGradient><linearGradient id="inside" x2="0" y2="1"><stop stop-color="#fff6e8"/><stop offset="1" stop-color="#fffaf2"/></linearGradient><linearGradient id="core" x2="0" y2="1"><stop stop-color="#e3e4f5"/><stop offset="1" stop-color="#eae9f8"/></linearGradient></defs><rect width="900" height="210" fill="url(#out)"/><rect y="210" width="900" height="100" fill="url(#core)"/><rect y="310" width="900" height="200" fill="url(#inside)"/><text x="24" y="34" font-size="21" font-weight="700" fill="#245678">Uden for cellen</text><text x="24" y="483" font-size="21" font-weight="700" fill="#865a2a">Inde i cellen</text><g id="lipids"></g><g id="protein"><g id="leftHalf"><path class="protein" d="M446 177 Q381 175 382 214 L382 307 Q381 345 446 343 L446 177 Z"/><path class="proteinInner" d="M436 185 L446 185 L446 335 L436 335 Q422 310 424 260 Q422 208 436 185 Z"/></g><g id="rightHalf"><path class="protein" d="M454 177 Q519 175 518 214 L518 307 Q519 345 454 343 L454 177 Z"/><path class="proteinInner" d="M464 185 L454 185 L454 335 L464 335 Q478 310 476 260 Q478 208 464 185 Z"/></g><text x="450" y="164" font-size="17" text-anchor="middle" font-weight="700" fill="#a52d2d">Protein 3</text></g><g id="kTransit"></g><g id="atpLayer"></g><g id="naLayer"></g><g id="kLayer"></g></svg></div><div class="legend"><span><i class="dot" style="background:#ffae42"></i>Na⁺</span><span><i class="dot" style="background:#45bf83"></i>K⁺</span><span><i class="dot" style="background:#5da6dd"></i>Fosfolipidernes hydrofile hoveder</span><span><i class="dot" style="background:#d94b47"></i>Membranprotein</span></div><div class="row" style="margin-top:15px"><div class="group"><strong>Uden for cellen</strong><div class="buttons"><button id="naOut">+5 Na⁺</button><button id="kOut">+5 K⁺</button></div><div class="readout count">Na⁺: <span id="naOutN">0</span> · K⁺: <span id="kOutN">0</span></div></div><div class="group"><strong>Inde i cellen</strong><div class="buttons"><button id="naIn">+5 Na⁺</button><button id="kIn">+5 K⁺</button></div><div class="readout count">Na⁺: <span id="naInN">0</span> · K⁺: <span id="kInN">0</span></div><div class="buttons" style="margin-top:10px"><button id="addATP">+1 ATP</button></div><div class="readout">ATP: <span id="atpCount">0</span></div></div></div></section></main><script>
(()=>{'use strict';
const NS='http://www.w3.org/2000/svg', $=id=>document.getElementById(id), voltage=$('voltage');
const particles=[], atps=[], counts={naOut:0,naIn:0,kOut:0,kIn:0};
let seq=0,active=null,last=0, potential=-85;
function el(tag,attrs,parent){let e=document.createElementNS(NS,tag);for(let [k,v] of Object.entries(attrs))e.setAttribute(k,v);parent.appendChild(e);return e}
for(let x=13;x<900;x+=22){if(x>380&&x<520)continue;for(let y of [218,302]){el('line',{x1:x-3,y1:y===218?229:290,x2:x-5,y2:y===218?254:267,class:'tail'},$('lipids'));el('line',{x1:x+3,y1:y===218?229:290,x2:x+5,y2:y===218?254:267,class:'tail'},$('lipids'));el('circle',{cx:x,cy:y,r:8,class:'head'},$('lipids'))}}
function randomPos(side){let x=40+Math.random()*820;if(x>375&&x<525)x=x<450?355:545;return {x,y:side==='Out'?56+Math.random()*118:352+Math.random()*98}}
function addIon(type,side){for(let i=0;i<5;i++){let pos=randomPos(side);particles.push({id:seq++,type,side,...pos,vx:(Math.random()-.5)*.9,vy:(Math.random()-.5)*.9});counts[type+side]++}update()}
function addATP(){let pos={x:115+Math.random()*660,y:405+Math.random()*38};atps.push({id:seq++,x:pos.x,y:pos.y,originX:pos.x,originY:pos.y,phase:'approach',elapsed:0});update()}
function update(){voltage.value=potential;$('mv').textContent=(potential<0?'−':potential>0?'+':'')+Math.abs(potential)+' mV';$('state').textContent=active?'Aktiv':'Lukket';$('state').style.background=active?'#fce0df':'#e7eef6';$('leftHalf').setAttribute('transform',(active&&active.phase!=='approach')?'translate(-28 0)':'translate(0 0)');$('rightHalf').setAttribute('transform',(active&&active.phase!=='approach')?'translate(28 0)':'translate(0 0)');for(let k in counts)$(k+'N').textContent=counts[k];$('atpCount').textContent=atps.length}
function smooth(t){t=Math.max(0,Math.min(1,t));return t*t*(3-2*t)}
function mix(a,b,t){return a+(b-a)*smooth(t)}
function startCycle(a){active={atp:a,phase:'approach',elapsed:0,na:[],k:[]};a.phase='approach';update()}
function choose(type,side,n){return particles.filter(p=>p.type===type&&p.side===side&&!p.locked).slice(0,n)}
function advance(){let c=active;if(!c)return;
if(c.phase==='approach'){c.phase='waiting';c.elapsed=0;c.atp.x=490;c.atp.y=337;c.atp.phase='bound';update();return}
if(c.phase==='waiting'){if(counts.naIn>=3&&counts.kOut>=2){c.na=choose('na','In',3);c.k=choose('k','Out',2);if(c.na.length===3&&c.k.length===2){for(let p of [...c.na,...c.k]){p.locked=true;p.sx=p.x;p.sy=p.y}c.phase='naBind';c.elapsed=0}}return}
if(c.phase==='naBind'){c.phase='cleavage';c.elapsed=0;c.atp.phase='cleavage';return}
if(c.phase==='cleavage'){c.phase='naOut';c.elapsed=0;c.atp.phase='products';return}
if(c.phase==='naOut'){for(let p of c.na){p.side='Out';p.locked=false;let pos=randomPos('Out');p.x=pos.x;p.y=pos.y}counts.naIn-=3;counts.naOut+=3;c.phase='kIn';c.elapsed=0;update();return}
if(c.phase==='kIn'){for(let p of c.k){p.side='In';p.locked=false;let pos=randomPos('In');p.x=pos.x;p.y=pos.y}counts.kOut-=2;counts.kIn+=2;potential=Math.min(-70,potential+5);c.atp.phase='done';atps.splice(atps.indexOf(c.atp),1);active=null;update()}}
function motion(p,dt){if(p.locked)return;let scale=dt/16;p.vx+=(Math.random()-.5)*.065*scale;p.vy+=(Math.random()-.5)*.065*scale;let v=Math.hypot(p.vx,p.vy);if(v>1.15){p.vx*=1.15/v;p.vy*=1.15/v}p.x+=p.vx*scale;p.y+=p.vy*scale;let lo=p.side==='Out'?52:348,hi=p.side==='Out'?185:458;if(p.x<28||p.x>872){p.x=Math.max(28,Math.min(872,p.x));p.vx*=-1}if(p.y<lo||p.y>hi){p.y=Math.max(lo,Math.min(hi,p.y));p.vy*=-1}}
function updatePhase(dt){if(!active){let a=atps.find(a=>a.phase==='approach');if(a)startCycle(a);return}let c=active;c.elapsed+=dt;let t=Math.min(1,c.elapsed/(c.phase==='approach'?2500:3000));
if(c.phase==='approach'){c.atp.x=mix(c.atp.originX,490,t);c.atp.y=mix(c.atp.originY,337,t);if(t>=1)advance()}
else if(c.phase==='waiting'){advance()}
else if(c.phase==='naBind'){c.na.forEach((p,i)=>{let ti=Math.max(0,Math.min(1,(t-i*.14)/.72));p.x=mix(p.sx,450,ti);p.y=mix(p.sy,320-i*16,ti)});if(t>=1)advance()}
else if(c.phase==='cleavage'){if(t>=1)advance()}
else if(c.phase==='naOut'){c.na.forEach((p,i)=>{let ti=Math.max(0,Math.min(1,(t-i*.16)/.68));p.x=450;p.y=mix(320-i*16,115-i*17,ti)});if(t>=1)advance()}
else if(c.phase==='kIn'){c.k.forEach((p,i)=>{let ti=Math.max(0,Math.min(1,(t-i*.18)/.75));p.x=mix(p.sx,450,Math.min(1,ti*1.8));p.y=mix(p.sy,390+i*19,ti)});if(t>=1)advance()}}
function drawIon(p){let g=$(p.type==='na'?'naLayer':'kLayer');el('circle',{cx:p.x,cy:p.y,r:13,class:p.type==='na'?'ionNa':'ionK'},g);let t=el('text',{x:p.x,y:p.y+1,class:'ionText'},g);t.textContent=p.type==='na'?'Na⁺':'K⁺'}
function drawATP(a){let g=el('g',{transform:`translate(${a.x} ${a.y})`},$('atpLayer'));let cleavage=a.phase==='cleavage',products=a.phase==='products';let progress=active&&active.atp===a?Math.min(1,active.elapsed/3000):0;
let fade=products?Math.max(0,1-progress):1;g.setAttribute('opacity',fade);
el('ellipse',{cx:0,cy:0,rx:26,ry:16,class:'atpBody'},g);
for(let i=0;i<((products||cleavage)?2:3);i++){let x=29+i*19;el('circle',{cx:x,cy:0,r:10,class:'phosphate'},g);let t=el('text',{x,y:1,class:'phosphateText'},g);t.textContent='P'}
if(cleavage||products){let separation=cleavage?progress*57:57+progress*30;let y=cleavage?-progress*30:-30-progress*35;el('circle',{cx:67+separation,cy:y,r:10,class:'phosphate'},g);let t=el('text',{x:67+separation,y:y+1,class:'phosphateText'},g);t.textContent='P'} }
function render(){for(let id of ['naLayer','kLayer','atpLayer'])$(id).replaceChildren();particles.forEach(drawIon);atps.forEach(drawATP)}
function tick(time){let dt=Math.min(50,time-last||16);last=time;for(let p of particles)motion(p,dt);updatePhase(dt);render();requestAnimationFrame(tick)}
for(let type of ['na','k'])for(let side of ['Out','In'])$(type+side).addEventListener('click',()=>addIon(type,side));
$('addATP').addEventListener('click',addATP);
voltage.addEventListener('input',()=>{potential=+voltage.value;update()});
$('reset').addEventListener('click',()=>{particles.length=0;atps.length=0;active=null;potential=-85;for(let k in counts)counts[k]=0;update()});
update();requestAnimationFrame(tick);
})();
</script></body></html>
