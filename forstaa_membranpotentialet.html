<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forstå membranpotentialet</title><style>
:root{font-family:system-ui,Arial,sans-serif;color:#172b40;background:#f3f7fb}*{box-sizing:border-box}main{max-width:1050px;margin:24px auto;padding:0 16px}h1{font-size:1.65rem;margin:0 0 17px}.panel{background:white;border:1px solid #d9e4ef;border-radius:16px;padding:18px;box-shadow:0 4px 18px #1d385015}.visual{position:relative;width:100%;border:1px solid #cbdce8;border-radius:13px;overflow:hidden;background:#eaf7ff}svg{display:block;width:100%;height:auto}.head{fill:#5da6dd;stroke:#286c9d;stroke-width:1.3}.tail{stroke:#7a9aaf;stroke-width:3;stroke-linecap:round}.ionNa{fill:#ffae42;stroke:#9c5500;stroke-width:1.7}.ionK{fill:#45bf83;stroke:#167249;stroke-width:1.7}.ionCl{fill:#b6a2ef;stroke:#65509f;stroke-width:1.7}.ionText{font-size:12px;font-weight:800;fill:#172b40;text-anchor:middle;dominant-baseline:middle;pointer-events:none}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}.group{border:1px solid #dce5ed;border-radius:12px;padding:14px}.group strong{display:block;margin-bottom:10px}.buttons{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}button{border:1px solid #9bb6d2;background:#eef6ff;color:#153f6a;border-radius:9px;padding:9px 12px;font-size:.94rem;cursor:pointer}button:hover{background:#dbeeff}button:focus-visible{outline:3px solid #f4a340;outline-offset:2px}.stats{width:100%;border-collapse:collapse;font-size:.94rem}.stats td{padding:5px 3px;border-bottom:1px solid #e7edf3}.stats td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:650}.stats tr:last-child td{border-bottom:0;font-weight:800}.legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:13px;font-size:.9rem}.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px;vertical-align:middle}.toolbar{display:flex;justify-content:flex-end;margin-top:12px}.potential{font-size:23px;font-weight:800;fill:#164b75;text-anchor:middle}.potentialSmall{font-size:15px;fill:#164b75;text-anchor:middle}.hint{font-size:.86rem;color:#566b7f;margin-top:12px} @media(max-width:650px){.row{grid-template-columns:1fr}.panel{padding:12px}h1{font-size:1.4rem}}
</style></head><body><main><h1>Forstå membranpotentialet</h1><section class="panel"><div class="visual"><svg id="scene" viewBox="0 0 900 510" role="img" aria-label="Fosfolipid-dobbeltmembran med natrium-, kalium- og chloridioner, der bevæger sig på hver side. Membranpotentialet vises inde i cellen."><defs><linearGradient id="out" x2="0" y2="1"><stop stop-color="#e0f5ff"/><stop offset="1" stop-color="#effaff"/></linearGradient><linearGradient id="inside" x2="0" y2="1"><stop stop-color="#fff6e8"/><stop offset="1" stop-color="#fffaf2"/></linearGradient><linearGradient id="core" x2="0" y2="1"><stop stop-color="#e3e4f5"/><stop offset="1" stop-color="#eae9f8"/></linearGradient></defs><rect width="900" height="210" fill="url(#out)"/><rect y="210" width="900" height="100" fill="url(#core)"/><rect y="310" width="900" height="200" fill="url(#inside)"/><text x="24" y="34" font-size="21" font-weight="700" fill="#245678">Uden for cellen</text><text x="24" y="483" font-size="21" font-weight="700" fill="#865a2a">Inde i cellen</text><g id="lipids"></g><g id="particles"></g><g id="readout"><rect x="605" y="369" width="265" height="76" rx="12" fill="#fff" fill-opacity=".93" stroke="#9db9d2" stroke-width="2"/><text class="potentialSmall" x="737" y="395">Membranpotentiale</text><text id="mv" class="potential" x="737" y="427">0 mV</text></g></svg></div><div class="legend"><span><i class="dot" style="background:#ffae42"></i>Na⁺</span><span><i class="dot" style="background:#45bf83"></i>K⁺</span><span><i class="dot" style="background:#b6a2ef"></i>Cl⁻</span><span><i class="dot" style="background:#5da6dd"></i>Fosfolipidernes hydrofile hoveder</span></div><div class="row"><div class="group"><strong>Uden for cellen</strong><div class="buttons"><button id="naOut">+5 Na⁺</button><button id="kOut">+5 K⁺</button><button id="clOut">+5 Cl⁻</button></div><table class="stats"><tbody><tr><td>Na⁺</td><td id="naOutN">0</td></tr><tr><td>K⁺</td><td id="kOutN">0</td></tr><tr><td>Samlet antal positive ioner</td><td id="posOut">0</td></tr><tr><td>Cl⁻</td><td id="clOutN">0</td></tr><tr><td>Samlet ladning</td><td id="netOut">0</td></tr></tbody></table></div><div class="group"><strong>Inde i cellen</strong><div class="buttons"><button id="naIn">+5 Na⁺</button><button id="kIn">+5 K⁺</button><button id="clIn">+5 Cl⁻</button></div><table class="stats"><tbody><tr><td>Na⁺</td><td id="naInN">0</td></tr><tr><td>K⁺</td><td id="kInN">0</td></tr><tr><td>Samlet antal positive ioner</td><td id="posIn">0</td></tr><tr><td>Cl⁻</td><td id="clInN">0</td></tr><tr><td>Samlet ladning</td><td id="netIn">0</td></tr></tbody></table></div></div><div class="toolbar"><button id="reset">Nulstil</button></div></section></main><script>
(()=>{'use strict';const NS='http://www.w3.org/2000/svg',by=id=>document.getElementById(id);const counts={naOut:0,naIn:0,kOut:0,kIn:0,clOut:0,clIn:0};const particles=[];const layer=by('particles');function svg(tag,attrs,parent){const el=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))el.setAttribute(k,v);parent.appendChild(el);return el}for(let x=13;x<900;x+=22){for(const y of [218,302]){svg('line',{x1:x-3,y1:y===218?229:290,x2:x-5,y2:y===218?254:267,class:'tail'},by('lipids'));svg('line',{x1:x+3,y1:y===218?229:290,x2:x+5,y2:y===218?254:267,class:'tail'},by('lipids'));svg('circle',{cx:x,cy:y,r:8,class:'head'},by('lipids'))}}function signed(n){return n>0?'+'+n:String(n)}function update(){for(const k of Object.keys(counts))by(k+'N').textContent=counts[k];for(const side of ['Out','In']){const pos=counts['na'+side]+counts['k'+side];by('pos'+side).textContent=pos;by('net'+side).textContent=signed(pos-counts['cl'+side])}const inside=counts.naIn+counts.kIn-counts.clIn,outside=counts.naOut+counts.kOut-counts.clOut;by('mv').textContent=signed((inside-outside)*2)+' mV'}function add(type,side){for(let i=0;i<5;i++){const outer=side==='Out';const x=30+Math.random()*840,y=outer?55+Math.random()*130:350+Math.random()*105;const p={type,side,x,y,vx:(Math.random()-.5)*.8,vy:(Math.random()-.5)*.8};const g=svg('g',{},layer);p.g=g;svg('circle',{cx:0,cy:0,r:13,class:type==='na'?'ionNa':type==='k'?'ionK':'ionCl'},g);const label=svg('text',{x:0,y:1,class:'ionText'},g);label.textContent=type==='na'?'Na⁺':type==='k'?'K⁺':'Cl⁻';g.setAttribute('transform',`translate(${x} ${y})`);particles.push(p);counts[type+side]++}update()}let last=0;function tick(t){const dt=Math.min(40,t-last||16)/16;last=t;for(const p of particles){p.vx+=(Math.random()-.5)*.065*dt;p.vy+=(Math.random()-.5)*.065*dt;const speed=Math.hypot(p.vx,p.vy);if(speed>1.15){p.vx*=1.15/speed;p.vy*=1.15/speed}p.x+=p.vx*dt;p.y+=p.vy*dt;const ymin=p.side==='Out'?53:345,ymax=p.side==='Out'?184:462;if(p.x<25){p.x=25;p.vx=Math.abs(p.vx)}if(p.x>875){p.x=875;p.vx=-Math.abs(p.vx)}if(p.y<ymin){p.y=ymin;p.vy=Math.abs(p.vy)}if(p.y>ymax){p.y=ymax;p.vy=-Math.abs(p.vy)}p.g.setAttribute('transform',`translate(${p.x.toFixed(1)} ${p.y.toFixed(1)})`)}requestAnimationFrame(tick)}for(const type of ['na','k','cl'])for(const side of ['Out','In'])by(type+side).addEventListener('click',()=>add(type,side));by('reset').addEventListener('click',()=>{particles.length=0;layer.replaceChildren();for(const k in counts)counts[k]=0;update()});update();requestAnimationFrame(tick)})();
</script></body></html>
